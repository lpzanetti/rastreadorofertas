<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio - Rastreador de Ofertas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <base href="https://www.rastreadordeofertas.com.br/bio/">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Mobile Container Frame matching wireframe layout */
    .app-viewport {
      width: 100%;
      height: 90vh;
      background: #1e293b;
      border-radius: 20px;
      border: 3px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Região Azul: Topo fixo com logo centralizado e sub-título */
    .header-section {
      background: #4242c6;
      border: 2.5px solid #3b82f6;
      border-radius: 12px;
      margin: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.4);
      z-index: 10;
      flex-shrink: 0;
    }

    .header-logo-box {
      width: 80%;
      border: 2px solid #60a5fa;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 8px 16px;
      text-align: center;
    }

    .header-logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(96, 165, 250, 0.6);
    }

    .header-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Região Verde: Lista vertical de cards de produtos com scroll */
    .products-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      position: relative;
    }

    /* Styling custom scrollbar */
    .products-container::-webkit-scrollbar {
      width: 6px;
    }

    .products-container::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }

    .products-container::-webkit-scrollbar-thumb {
      background: #10b981;
      border-radius: 4px;
    }

    /* Card de Produto */
    .product-card {
      background: rgba(6, 78, 59, 0.25);
      border: 2px solid #10b981;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      cursor: pointer;
      flex-shrink: 0;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
      background: rgba(6, 78, 59, 0.4);
    }

    .product-photo-box {
      width: 68px;
      height: 68px;
      border: 1.5px solid #34d399;
      border-radius: 8px;
      overflow: hidden;
      background: #064e3b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .product-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .product-category {
      font-size: 11px;
      font-weight: 600;
      color: #6ee7b7;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .product-name-brand {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .product-price {
      font-size: 13px;
      font-weight: 600;
      color: #34d399;
      margin-top: 2px;
    }

    /* Indicador de rolagem estilo wireframe (círculo vermelho com triângulo no canto inferior direito da lista de cards) */
    .scroll-indicator-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      aspect-ratio: 1 / 1;
      border: 3px solid #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);
      z-index: 50;
      cursor: pointer;
      pointer-events: auto;
      flex-shrink: 0;
      transition: transform 0.2s ease, opacity 0.3s ease;
      animation: bounce 1.5s infinite;
    }

    .scroll-indicator-icon:hover {
      transform: scale(1.1);
    }


    .scroll-indicator-icon::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 11px solid #ef4444;
      margin-top: 2px;
    }



    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(4px);
      }
    }

    /* Região Laranja: Rodapé fixo com banner centralizado */
    .footer-section {
      background: rgba(124, 45, 18, 0.3);
      border: 2.5px solid #f97316;
      border-radius: 12px;
      margin: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 -4px 12px rgba(249, 115, 22, 0.2);
    }

    .footer-banner-box {
      width: 95%;
      height: 60px;
      border: 2px solid #fb923c;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(234, 88, 12, 0.4)), url('banner.png');
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .footer-banner-text {
      font-size: 18px;
      font-weight: 700;
      color: #ffedd5;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 10px rgba(249, 115, 22, 0.8);
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid rgba(251, 146, 60, 0.5);
    }

    /* Responsividade para Desktop */
    @media (min-width: 768px) {
      body {
        padding: 24px;
      }

      .header-logo-box {
        width: 50%;
        max-width: 400px;
      }

      .products-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        padding: 16px;
        align-content: start;
      }

      .product-card {
        height: auto;
      }

      .scroll-indicator-icon {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="app-viewport">

    <!-- REGIAO AZUL: TOPO FIXO -->
    <header class="header-section">
      <img src="rastreador1.png" style="height:80px;">
      <span class="header-subtitle">Produtos em Destaque</span>
    </header>

    <!-- REGIAO VERDE: CARDS DE PRODUTOS COM SCROLL (Até 5 produtos na tela) -->
    <section class="products-container" id="productList">

      <!-- Card 1 -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="BioBand Pro" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">BIOMETRIA</span>
          <h2 class="product-name-brand">BioBand Pro 5</h2>
        </div>
      </article>

      <!-- Card 2 -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="Pulseira Tech" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">SAÚDE & FITNESS</span>
          <h2 class="product-name-brand">Pulseira Tech Ultra</h2>
        </div>
      </article>

      <!-- Card 3 -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="CardioTrack" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">MONITORAMENTO</span>
          <h2 class="product-name-brand">CardioTrack X1</h2>
        </div>
      </article>

      <!-- Card 4 -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="SmartSensor" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">SENSORES</span>
          <h2 class="product-name-brand">SmartSensor Vital</h2>
        </div>
      </article>

      <!-- Card 5 (Último visível na tela inicial no mobile) -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="Gps Tracker" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">RASTREADORES</span>
          <h2 class="product-name-brand">Gps Tracker Bio</h2>
        </div>
      </article>

      <!-- Card 6 (Exemplo de item acessível via scroll) -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="Oxímetro Smart" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">DISPOSITIVOS</span>
          <h2 class="product-name-brand">Oxímetro Smart O2</h2>
        </div>
      </article>

      <!-- Card 7 -->
      <article class="product-card">
        <div class="product-photo-box">
          <img src="product.png" alt="Sleep Monitor" class="product-photo" />
        </div>
        <div class="product-info">
          <span class="product-category">SONO</span>
          <h2 class="product-name-brand">Sleep Monitor Night</h2>
        </div>
      </article>

      <!-- Círculo vermelho com triângulo apontando para baixo (indicador de scroll no canto inferior direito da região verde) -->
      <div class="scroll-indicator-icon" title="Role para ver mais produtos"></div>

    </section>


    <!-- REGIAO LARANJA: RODAPÉ FIXO COM BANNER CENTRALIZADO -->
    <footer class="footer-section">
      <img src="banner-ofertas.jpg" style="height:80px;">
    </footer>

  </main>

  <script>
    const productList = document.getElementById('productList');
    const scrollIndicator = document.querySelector('.scroll-indicator-icon');

    if (productList && scrollIndicator) {
      // Ao clicar no indicador, faz a rolagem para baixo
      scrollIndicator.addEventListener('click', () => {
        productList.scrollBy({
          top: 200,
          behavior: 'smooth'
        });
      });

      // Controla a visibilidade do indicador ao rolar
      productList.addEventListener('scroll', () => {
        if (productList.scrollTop > 30) {
          scrollIndicator.style.opacity = '0';
          scrollIndicator.style.pointerEvents = 'none';
        } else {
          scrollIndicator.style.opacity = '1';
          scrollIndicator.style.pointerEvents = 'auto';
        }
      });
    }
  </script>

</body>

</html>
